<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NekoTool · StatusCast Widget</title>
  <style>
    :root {
      --bg: rgba(12, 17, 30, 0.82);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
    }

    .widget {
      width: min(420px, calc(100vw - 20px));
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        radial-gradient(circle at 15% 10%, rgba(34, 211, 238, 0.14), transparent 42%),
        linear-gradient(135deg, rgba(30, 41, 59, 0.92), rgba(8, 12, 22, 0.9));
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 rgba(100, 116, 139, 0.5);
    }

    .live.online .dot {
      background: #34d399;
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
      animation: pulse 2s infinite;
    }

    .main {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .ring {
      --level: 0;
      position: relative;
      flex: 0 0 auto;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) calc(var(--level) * 1%), rgba(255, 255, 255, 0.08) 0);
      display: grid;
      place-items: center;
      transition: background 0.4s ease;
    }

    .ring::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      background: #0b1120;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.45);
    }

    .ring-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: 1px;
    }

    .level {
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .percent {
      font-size: 11px;
      color: var(--muted);
    }

    .info {
      min-width: 0;
      flex: 1;
    }

    .model {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .battery-line {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .media {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      color: #cbd5e1;
    }

    .media strong {
      color: var(--text);
      font-weight: 600;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 11px;
      font-size: 10px;
      color: #64748b;
    }

    .offline {
      color: #f87171;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45);
      }
      70% {
        box-shadow: 0 0 0 7px rgba(52, 211, 153, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(52, 211, 153, 0);
      }
    }
  </style>
</head>
<body>
  <section class="widget" id="widget">
    <div class="top">
      <div class="brand">NekoTool · StatusCast</div>
      <div class="live" id="live">
        <span class="dot"></span>
        <span id="liveText">CONNECTING</span>
      </div>
    </div>

    <div class="main">
      <div class="ring" id="ring">
        <div class="ring-inner">
          <span class="level" id="level">--</span>
          <span class="percent">%</span>
        </div>
      </div>

      <div class="info">
        <div class="model" id="model">等待状态…</div>
        <div class="battery-line" id="batteryLine">StatusCast API</div>
        <div class="media" id="media">🎵 暂无播放</div>
      </div>
    </div>

    <div class="footer">
      <span id="clock">--:--</span>
      <span>localhost:5099</span>
    </div>
  </section>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const endpoint = params.get("url") || "http://localhost:5099/status/";
      const pollMs = 2000;

      const ring = document.getElementById("ring");
      const level = document.getElementById("level");
      const model = document.getElementById("model");
      const batteryLine = document.getElementById("batteryLine");
      const media = document.getElementById("media");
      const live = document.getElementById("live");
      const liveText = document.getElementById("liveText");
      const clock = document.getElementById("clock");

      const offlineText = "📱 -- | 🔋 -- | 🎵 --";

      function setAccent(levelValue) {
        let accent = "#22d3ee";
        if (levelValue !== null && levelValue < 20) accent = "#ef4444";
        else if (levelValue !== null && levelValue >= 80) accent = "#f6c453";
        document.documentElement.style.setProperty("--accent", accent);
      }

      function render(data) {
        const battery = data && data.battery ? data.battery : {};
        const mediaData = data && data.media ? data.media : {};
        const value = Number.isFinite(battery.level) ? Math.max(0, Math.min(100, battery.level)) : null;
        const text = data && data.text ? data.text : offlineText;
        const modelText = text.split("|")[0].replace(/^📱\s*/, "").trim() || "未知机型";

        level.textContent = value === null ? "--" : value;
        ring.style.setProperty("--level", value === null ? 0 : value);
        setAccent(value);

        model.textContent = modelText;

        const charging = battery.isCharging === true ? " ⚡ 充电中" : "";
        batteryLine.textContent = value === null
          ? "USB 设备未连接"
          : `🔋 ${value}%${charging}`;

        const title = mediaData.title || "";
        const artist = mediaData.artist || "";
        if (title) {
          media.innerHTML = `🎵 <strong>${escapeHtml(title)}</strong>${artist ? ` · ${escapeHtml(artist)}` : ""}`;
        } else {
          media.textContent = "🎵 暂无播放";
        }

        live.classList.add("online");
        liveText.textContent = "LIVE";
        clock.textContent = new Date().toLocaleTimeString("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function renderOffline() {
        level.textContent = "--";
        ring.style.setProperty("--level", 0);
        setAccent(null);
        model.textContent = "StatusCast 未连接";
        batteryLine.textContent = "请先启动 StatusCast";
        media.textContent = "🎵 --";
        live.classList.remove("online");
        liveText.textContent = "OFFLINE";
        clock.textContent = "--:--";
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[c]));
      }

      async function tick() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 1500);

        try {
          const response = await fetch(endpoint, {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          render(await response.json());
        } catch {
          renderOffline();
        } finally {
          clearTimeout(timer);
        }
      }

      tick();
      setInterval(tick, pollMs);
    })();
  </script>
</body>
</html>
